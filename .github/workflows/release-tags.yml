name: Tag plugin releases

# 正式版のエントリーは source.ref で <plugin>--v<version> タグに固定している。
# main に入ったリリースのタグを作り、エントリーが指すタグが存在する状態にする。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定では権限を与えず、必要な権限はジョブごとに付与する。
permissions: {}

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create missing release tags
        run: |
          set -euo pipefail
          self_url=https://github.com/murnana/murnana-claude-code-plugin.git
          status=0
          new_tags=()
          while IFS=$'\t' read -r name version ref; do
            tag="$name--v$version"
            if [ "$ref" != "$tag" ]; then
              echo "::error file=.claude-plugin/marketplace.json::$name: source.ref is '$ref' but version $version needs '$tag'"
              status=1
              continue
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # 既存のタグと中身が違うなら、版を上げずにプラグインを変えている。
              if [ "$(git rev-parse "$tag:plugins/$name")" != "$(git rev-parse "HEAD:plugins/$name")" ]; then
                echo "::error::$name changed on main without a version bump: plugins/$name differs from tag $tag"
                status=1
              fi
              continue
            fi
            git tag "$tag" HEAD
            new_tags+=("$tag")
          done < <(jq -r --arg url "$self_url" \
            '.plugins[] | select(.source.url == $url) | [.name, .version, (.source.ref // "")] | @tsv' \
            .claude-plugin/marketplace.json)

          if [ ${#new_tags[@]} -gt 0 ]; then
            git push origin "${new_tags[@]/#/refs/tags/}"
            printf 'Created %s\n' "${new_tags[@]}"
          else
            echo "No new release tags."
          fi
          exit $status

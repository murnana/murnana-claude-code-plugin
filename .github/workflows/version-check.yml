name: Check plugin versions

on:
  pull_request:
    branches: [main, develop]

# 既定では権限を与えず、必要な権限はジョブごとに付与する。
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
      - name: Check plugin versions
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          status=0
          manifest=.claude-plugin/marketplace.json
          # ベースにまだ marketplace.json が無い場合に備え、空の plugins で受ける。
          base_manifest=$({ git show "origin/$BASE_REF:$manifest" 2>/dev/null || true; })
          [ -n "$base_manifest" ] || base_manifest='{"plugins":[]}'

          for dir in plugins/*/; do
            name=$(basename "$dir")
            plugin_json="plugins/$name/.claude-plugin/plugin.json"
            [ -f "$plugin_json" ] || continue

            # plugin.json の version はマーケットプレイスのエントリーより優先される。
            # 書くと dev チャンネルがコミットを追従しなくなるため、version はエントリーだけに置く。
            if jq -e 'has("version")' "$plugin_json" >/dev/null; then
              echo "::error file=$plugin_json::$name: remove version from plugin.json; set it only on the marketplace.json entry"
              status=1
            fi

            head_version=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version // empty' "$manifest")
            base_version=$(printf '%s' "$base_manifest" | jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version // empty')

            if ! printf '%s' "$head_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error file=$manifest::$name: entry version must be MAJOR.MINOR.PATCH (got '$head_version')"
              status=1
              continue
            fi

            # 正式版は source.sha でリリースしたコミットに固定する。main から辿れるよう、この PR の履歴にあることを確かめる。
            head_sha=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .source.sha // empty' "$manifest")
            base_sha=$(printf '%s' "$base_manifest" | jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .source.sha // empty')
            if ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error file=$manifest::$name: source.sha must be a full 40-character commit SHA (got '$head_sha'); run: sh scripts/set-plugin-version.sh $name $head_version"
              status=1
              continue
            fi
            if ! git cat-file -e "$head_sha^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$head_sha" HEAD; then
              echo "::error file=$manifest::$name: source.sha $head_sha is not in this PR's history; push that commit"
              status=1
              continue
            fi
            # main に入る中身と、固定したコミットの中身が一致していなければ、利用者に届くファイルが食い違う。
            if [ "$BASE_REF" = "main" ] \
              && [ "$(git rev-parse -q --verify "$head_sha:plugins/$name" || true)" != "$(git rev-parse "HEAD:plugins/$name")" ]; then
              echo "::error file=$manifest::$name: plugins/$name differs from source.sha $head_sha; run: sh scripts/set-plugin-version.sh $name <new-version>"
              status=1
            fi
            [ -n "$base_version" ] || continue

            if [ "$BASE_REF" = "main" ]; then
              changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- "plugins/$name" | head -n 1)
              [ -n "$changed" ] || continue
              newest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -n 1)
              if [ "$head_version" = "$base_version" ] || [ "$newest" != "$head_version" ]; then
                echo "::error file=$manifest::$name changed but its version was not raised ($base_version -> $head_version)"
                status=1
              fi
            elif [[ "$HEAD_REF" == feature/* || "$HEAD_REF" == bugfix/* ]]; then
              if [ "$head_version" != "$base_version" ]; then
                echo "::error file=$manifest::$name: do not change the version in a $HEAD_REF PR ($base_version -> $head_version); versions are bumped in the develop -> main PR"
                status=1
              fi
              if [ -n "$base_sha" ] && [ "$head_sha" != "$base_sha" ]; then
                echo "::error file=$manifest::$name: do not change source.sha in a $HEAD_REF PR; it is updated with the version in the develop -> main PR"
                status=1
              fi
            fi
          done
          exit $status
      - name: Check dev channel catalog
        # channels/dev は .claude-plugin/marketplace.json から生成する。手で編集した差分や再生成忘れを止める。
        run: sh scripts/build-dev-marketplace.sh --check
